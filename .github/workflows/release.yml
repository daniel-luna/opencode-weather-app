name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      should_release: ${{ steps.read.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Leer la version de package.json
        run: |
          version="$(jq -r '.version // empty' package.json)"
          if [ -z "$version" ]; then
            echo "::error::package.json no tiene campo 'version'"
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' no es una version semver valida"
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "El tag $tag ya existe: no se publica nada."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Se publicara el release $tag."
          fi

  build:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: weather-linux-x64
          - os: ubuntu-24.04-arm
            asset: weather-linux-arm64
          - os: macos-15
            asset: weather-macos-arm64
          - os: macos-15-intel
            asset: weather-macos-x64
          - os: windows-latest
            asset: weather-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Correr los tests y compilar el binario
        run: bun run build
      - name: Nombrar el asset
        shell: bash
        run: mv dist/weather* "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: weather-*
          merge-multiple: true
          path: dist
      - name: Crear el tag y publicar el release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x dist/weather-*
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" dist/weather-* \
            --title "$TAG" \
            --generate-notes \
            --verify-tag